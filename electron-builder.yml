appId: com.aimodeldesigner.app
productName: AI Model Designer
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.prettierrc,.prettierignore,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asar: true
icon: build/icon.png
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: AI Model Designer
